<main class="login-page">
  <section class="login-panel" aria-labelledby="login-title">
    <div class="login-heading">
      <span class="login-kicker">CRUD Cliente</span>
      <h1 id="login-title">Entrar</h1>
      <p>Acesse sua conta para gerenciar clientes e enderecos.</p>
    </div>

    <form class="login-form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <label class="form-field" for="email">
        <span>E-mail</span>
        <input
          id="email"
          type="email"
          formControlName="email"
          autocomplete="email"
          placeholder="usuario@email.com"
        />
        @if (emailInvalid) {
          <small>Informe um e-mail valido.</small>
        }
      </label>

      <label class="form-field" for="password">
        <span>Senha</span>
        <input
          id="password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
          placeholder="Sua senha"
        />
        @if (passwordInvalid) {
          <small>Informe sua senha.</small>
        }
      </label>

      @if (errorMessage) {
        <p class="form-error" role="alert">{{ errorMessage }}</p>
      }

      <button class="login-button" type="submit" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Entrando...' : 'Entrar' }}
      </button>
    </form>
  </section>
</main>
